schema = 1
project = "wolf3dorig"
default_profile = "agonport/emulator"
default_sd_mount = "/media/smith/AGON"
expected_sd_label = "AGON"

[bundles.wolf3d]
collection = "apps"
destination = "mystuff/Wolf3dOrig"
entry = "wolf3d.bin"
