schema = 1
project = "wolf3dorig"
default_profile = "agonport/emulator"
default_sd_mount = "/media/smith/AGON"
expected_sd_label = "AGON"

[bundles.wolf3d]
collection = "apps"
destination = "mystuff/Wolf3dOrig"
entry = "wolf3d.bin"
require = ["wolf3d.bin", "hud.agnb", "sfx.agnb"]
items = [
  { source = "src/asm/wolf3d/tgt/wolf3d.bin", destination = "wolf3d.bin" },
  { source = "agonport/assets/generated/wolf3d/hud/hud.agnb", destination = "hud.agnb" },
  { source = "agonport/assets/generated/wolf3d/audio/sfx.agnb", destination = "sfx.agnb" },
  { source = "agonport/assets/generated/wolf3d/levels/level_00", destination = "level_00", files = ["tiles.agnb", "sprites.agnb", "state_baby.w3l", "state_easy.w3l", "state_medium.w3l", "state_hard.w3l"] },
